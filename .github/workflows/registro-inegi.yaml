# Genera el registro de archivos del INEGI (data-raw/registro.R) y lo publica
# como artefacto de la ejecucion.
#
# - Manual: pestana Actions > registro-inegi.yaml > Run workflow.
# - Anual (15 de enero): si el registro generado difiere del que esta en el
#   repositorio, la ejecucion falla para avisar que el INEGI publico o cambio
#   archivos.
# - En pull requests que tocan el script, la lista de proyectos o este archivo.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 15 1 *'
  pull_request:
    paths:
      - 'data-raw/**'
      - 'R/registro.R'
      - 'R/utils-descarga.R'
      - '.github/workflows/registro-inegi.yaml'

name: registro-inegi.yaml

permissions: read-all

jobs:
  registro:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::pkgload

      - name: Generar el registro
        run: Rscript data-raw/registro.R

      - name: Resumen de cambios
        if: always()
        run: |
          git add --intent-to-add data-raw/registro_inegi.csv R/sysdata.rda 2>/dev/null || true
          {
            echo "## Registro de archivos del INEGI"
            echo
            echo '```'
            git diff --stat -- data-raw/registro_inegi.csv R/sysdata.rda || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Filas que el INEGI agrego, quito o cambio respecto del registro que
      # esta en el repositorio (como maximo 5 mil lineas).
      - name: Cambios en el registro
        if: always()
        run: git diff --unified=0 -- data-raw/registro_inegi.csv | head -n 5000

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: registro-inegi
          path: |
            data-raw/registro_inegi.csv
            R/sysdata.rda
          if-no-files-found: warn

      - name: Avisar si el registro cambio
        if: github.event_name == 'schedule'
        run: git diff --exit-code -- data-raw/registro_inegi.csv
