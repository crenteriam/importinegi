# Pruebas en vivo: ejecutan las funciones del paquete contra el sitio real del
# INEGI (tests/testthat/test-en-vivo-*.R). El resto de las pruebas no usa la red.
#
# - Manual: pestana Actions > pruebas-en-vivo.yaml > Run workflow. La opcion
#   medir_memoria agrega mediciones de tiempo y memoria con la muestra nacional
#   del Conteo 2005 (descarga 121 MB) y con la entidad mas grande de las
#   Encuestas Intercensales 2015 y 2025 (148 MB); no corren en los pull requests.
# - En pull requests que tocan el codigo del paquete o estas pruebas.
#
# Si el sitio del INEGI no responde, esta tarea falla aunque el paquete este
# bien; por eso va separada de R-CMD-check.
on:
  workflow_dispatch:
    inputs:
      medir_memoria:
        description: 'Medir tiempo y memoria con las muestras mas grandes (descarga 269 MB)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'R/**'
      - 'tests/testthat/test-en-vivo*'
      - 'tests/testthat/helper*'
      - '.github/workflows/pruebas-en-vivo.yaml'

name: pruebas-en-vivo.yaml

permissions: read-all

jobs:
  en-vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      IMPORTINEGI_EN_VIVO: "true"
      IMPORTINEGI_MEDIR_MEMORIA: ${{ inputs.medir_memoria && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # readxl: lo necesita la base "resultados" de intercensal()
          extra-packages: any::pkgload, any::testthat, any::withr, any::webfakes, any::readxl

      - name: Pruebas en vivo contra el INEGI
        run: Rscript -e 'testthat::test_local(filter = "en-vivo", stop_on_failure = TRUE)'
