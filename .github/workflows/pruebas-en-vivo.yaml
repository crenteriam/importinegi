# Pruebas en vivo: ejecutan las funciones del paquete contra el sitio real del
# INEGI (tests/testthat/test-en-vivo-*.R). El resto de las pruebas no usa la red.
#
# - Manual: pestana Actions > pruebas-en-vivo.yaml > Run workflow. La opcion
#   medir_memoria agrega mediciones de tiempo y memoria con la muestra nacional
#   del Conteo 2005 (descarga 121 MB) y con la entidad mas grande de las
#   Encuestas Intercensales 2015 y 2025 (148 MB), y con el primer trimestre de
#   2024 de la ENOE; no corren en los pull requests. La opcion enoe_serie lee e
#   integra los 86 trimestres de la ENOE (descarga 2.3 GB; tarda cerca de una
#   hora); tampoco corre en los pull requests.
# - En pull requests que tocan el codigo del paquete o estas pruebas.
#
# Si el sitio del INEGI no responde, esta tarea falla aunque el paquete este
# bien; por eso va separada de R-CMD-check.
on:
  workflow_dispatch:
    inputs:
      medir_memoria:
        description: 'Medir tiempo y memoria con las muestras mas grandes (descarga 269 MB)'
        type: boolean
        default: false
      enoe_serie:
        description: 'Leer e integrar los 86 trimestres de la ENOE (descarga 2.3 GB, cerca de una hora)'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'R/**'
      - 'tests/testthat/test-en-vivo*'
      - 'tests/testthat/helper*'
      - '.github/workflows/pruebas-en-vivo.yaml'

name: pruebas-en-vivo.yaml

permissions: read-all

jobs:
  en-vivo:
    runs-on: ubuntu-latest
    # Los pull requests tardan de 15 a 25 minutos; la serie completa de la ENOE,
    # cerca de una hora mas.
    timeout-minutes: ${{ inputs.enoe_serie && 180 || 45 }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      IMPORTINEGI_EN_VIVO: "true"
      IMPORTINEGI_MEDIR_MEMORIA: ${{ inputs.medir_memoria && 'true' || 'false' }}
      IMPORTINEGI_ENOE_SERIE: ${{ inputs.enoe_serie && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # readxl: lo necesita la base "resultados" de cpv_intercensal()
          extra-packages: any::pkgload, any::testthat, any::withr, any::webfakes, any::readxl

      - name: Pruebas en vivo contra el INEGI
        # Las lineas se recortan: una linea enorme en la salida de una prueba deja
        # el registro de la ejecucion sin el resto de la salida.
        shell: bash
        run: |
          set -o pipefail
          Rscript -e 'testthat::test_local(filter = "en-vivo", stop_on_failure = TRUE)' 2>&1 | cut -c1-3000
